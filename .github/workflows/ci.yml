name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install latest stable
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-wasip1
    
    - name: Install cargo-nextest
      run: |
        cargo install cargo-nextest --locked
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libdrm-dev pkg-config
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build project
      run: |
        cargo build --target wasm32-wasip1 --release --bin zellij-load-plugin --features plugin
        cargo build --release --bin zellij_system_monitor --features native
        cargo build --features native --tests

    - name: Run native tests
      run: |
        cargo test --features native
    
    - name: Run plugin tests
      run: |
        cargo nextest run --features plugin