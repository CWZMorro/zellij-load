name: Release
permissions: write-all
on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build WASM using just
        run: just build-wasm

      - name: Upload WASM to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: target/wasm32-wasip1/release/zellij-load-plugin.wasm
          asset_name: zellij-load-plugin.wasm
          asset_content_type: application/wasm

      - name: Update default.kdl with versioned plugin URL
        run: |
          sed -i 's|releases/.*/zellij-load-plugin\.wasm|releases/download/${{ github.event.release.tag_name }}/zellij-load-plugin.wasm|' default.kdl
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add default.kdl
          git diff --cached --quiet || git commit -m "chore: update plugin URL to ${{ github.event.release.tag_name }}"
          git push origin main
